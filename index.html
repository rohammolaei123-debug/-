<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Roham Drive 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial}
canvas{display:block}
#hud{
position:fixed;top:12px;left:12px;right:12px;
display:flex;justify-content:space-between;
z-index:10;pointer-events:none
}
.box{
background:rgba(10,15,20,.82);color:white;
padding:10px 14px;border-radius:12px
}
#controls{
position:fixed;bottom:20px;left:0;right:0;
display:flex;justify-content:space-between;
padding:0 18px;z-index:20;pointer-events:none
}
.group{display:flex;gap:10px;pointer-events:auto}
button{
width:72px;height:72px;border:0;border-radius:50%;
background:rgba(10,15,20,.85);color:white;
font-size:24px;font-weight:bold;
touch-action:none
}
.big{width:82px;border-radius:20px;font-size:15px}
#garage{
position:fixed;top:80px;right:12px;z-index:30;
background:rgba(10,15,20,.9);color:white;
padding:12px;border-radius:14px;display:none
}
select{
padding:8px;border-radius:8px;margin-top:6px
}
</style>
</head>

<body>

<div id="hud">
 <div class="box">
  <b>ROHAM DRIVE 3D</b><br>
  <span id="speed">سرعت: 0</span>
 </div>

 <div class="box">
  تهران • V3
  <button id="garageBtn"
   style="width:auto;height:auto;border-radius:8px;font-size:13px;padding:7px;margin-right:5px">
   گاراژ
  </button>
 </div>
</div>

<div id="garage">
 <b>گاراژ</b><br>
 رنگ ماشین:
 <select id="color">
  <option value="#111111">مشکی</option>
  <option value="#ffffff">سفید</option>
  <option value="#20252b">خاکستری</option>
  <option value="#174a7e">آبی</option>
  <option value="#8b1111">قرمز</option>
 </select>
</div>

<div id="controls">
 <div class="group">
  <button id="left">◀</button>
  <button id="right">▶</button>
 </div>

 <div class="group">
  <button class="big" id="brake">ترمز</button>
  <button class="big" id="gas">گاز</button>
 </div>
</div>

<script type="module">

import * as THREE from
"https://unpkg.com/three@0.160.0/build/three.module.js";

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x91c8e8);

scene.fog=new THREE.Fog(
  0x91c8e8,60,420
);

const camera=new THREE.PerspectiveCamera(
  65,
  innerWidth/innerHeight,
  .1,
  1000
);

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
 Math.min(devicePixelRatio,1.5)
);

renderer.setSize(
 innerWidth,
 innerHeight
);

document.body.appendChild(renderer.domElement);

/* نور */

scene.add(
 new THREE.HemisphereLight(
  0xffffff,
  0x444444,
  1.5
 )
);

const sun=new THREE.DirectionalLight(
  0xffffff,1.4
);

sun.position.set(80,120,50);
scene.add(sun);

/* زمین */

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(1000,1000),
 new THREE.MeshLambertMaterial({
  color:0x3d7040
 })
);

ground.rotation.x=-Math.PI/2;
scene.add(ground);

/* خیابان */

const road=new THREE.Mesh(
 new THREE.PlaneGeometry(20,1000),
 new THREE.MeshLambertMaterial({
  color:0x303338
 })
);

road.rotation.x=-Math.PI/2;
scene.add(road);

/* خط وسط */

for(let z=-480;z<500;z+=18){

 const line=new THREE.Mesh(
  new THREE.BoxGeometry(.3,.04,8),
  new THREE.MeshBasicMaterial({
   color:0xffffff
  })
 );

 line.position.set(0,.03,z);
 scene.add(line);
}

/* پیاده‌رو */

for(const x of [-12,12]){

 const side=new THREE.Mesh(
  new THREE.BoxGeometry(
   3,.25,1000
  ),
  new THREE.MeshLambertMaterial({
   color:0x777777
  })
 );

 side.position.set(x,.12,0);
 scene.add(side);
}

/* ساختمان‌ها */

function building(x,z){

 const h=8+Math.random()*22;

 const b=new THREE.Mesh(
  new THREE.BoxGeometry(
   8,h,18
  ),
  new THREE.MeshLambertMaterial({
   color:new THREE.Color(
    .25+Math.random()*.25,
    .25+Math.random()*.25,
    .25+Math.random()*.25
   )
  })
 );

 b.position.set(
  x,h/2,z
 );

 scene.add(b);
}

for(let z=-450;z<450;z+=28){

 building(-18-Math.random()*7,z);
 building(18+Math.random()*7,z+12);
}

/* برج میلاد ساده */

const tower=new THREE.Group();

const shaft=new THREE.Mesh(
 new THREE.CylinderGeometry(
  1.2,2,30,16
 ),
 new THREE.MeshLambertMaterial({
  color:0xbfc4c7
 })
);

shaft.position.y=15;
tower.add(shaft);

const top=new THREE.Mesh(
 new THREE.CylinderGeometry(
  5,3,3,24
 ),
 new THREE.MeshLambertMaterial({
  color:0xdddddd
 })
);

top.position.y=29;
tower.add(top);

tower.position.set(
 -45,0,-120
);

scene.add(tower);

/* برج آزادی ساده */

const azadi=new THREE.Group();

const left=new THREE.Mesh(
 new THREE.BoxGeometry(
  3,18,3
 ),
 new THREE.MeshLambertMaterial({
  color:0xe7e0c9
 })
);

left.rotation.z=.35;
left.position.set(-3,9,0);
azadi.add(left);

const right=left.clone();
right.rotation.z=-.35;
right.position.x=3;
azadi.add(right);

azadi.position.set(
 45,0,-220
);

scene.add(azadi);

/* ماشین */

const car=new THREE.Group();

car.position.set(
 0,0,20
);

scene.add(car);

/* بدنه */

const bodyMat=
new THREE.MeshLambertMaterial({
 color:0x174a7e
});

const body=new THREE.Mesh(
 new THREE.BoxGeometry(
  2.2,.65,4.5
 ),
 bodyMat
);

body.position.y=.7;
car.add(body);

/* سقف */

const roof=new THREE.Mesh(
 new THREE.BoxGeometry(
  1.65,.65,2.2
 ),
 new THREE.MeshLambertMaterial({
  color:0x123c62
 })
);

roof.position.y=1.25;
car.add(roof);

/* شیشه */

const glass=new THREE.Mesh(
 new THREE.BoxGeometry(
  1.5,.45,2.25
 ),
 new THREE.MeshBasicMaterial({
  color:0x182c3b
 })
);

glass.position.set(
 0,1.3,0
);

car.add(glass);

/* چرخ */

function wheel(x,z){

 const w=new THREE.Mesh(
  new THREE.CylinderGeometry(
   .42,.42,.3,18
  ),
  new THREE.MeshLambertMaterial({
   color:0x111111
  })
 );

 w.rotation.z=Math.PI/2;

 w.position.set(
  x,.45,z
 );

 car.add(w);
}

wheel(-1.15,-1.5);
wheel(1.15,-1.5);
wheel(-1.15,1.5);
wheel(1.15,1.5);

/* پلاک */

const plateCanvas=
document.createElement("canvas");

plateCanvas.width=512;
plateCanvas.height=128;

const pctx=
plateCanvas.getContext("2d");

pctx.fillStyle="#ffffff";
pctx.fillRect(0,0,512,128);

pctx.fillStyle="#111111";
pctx.font="bold 48px Arial";
pctx.textAlign="center";
pctx.fillText(
 "Roham molaei",
 256,82
);

const plateTexture=
new THREE.CanvasTexture(
 plateCanvas
);

const plate=new THREE.Mesh(
 new THREE.BoxGeometry(
  1.2,.25,.04
 ),
 new THREE.MeshBasicMaterial({
  map:plateTexture
 })
);

plate.position.set(
 0,.55,-2.28
);

car.add(plate);

/* کنترل */

const c={
 left:false,
 right:false,
 gas:false,
 brake:false
};

function control(id,key){

 const b=document.getElementById(id);

 b.addEventListener(
  "pointerdown",
  e=>{
   e.preventDefault();
   c[key]=true;
  }
 );

 b.addEventListener(
  "pointerup",
  ()=>{
   c[key]=false;
  }
 );

 b.addEventListener(
  "pointercancel",
  ()=>{
   c[key]=false;
  }
 );

 b.addEventListener(
  "pointerleave",
  ()=>{
   c[key]=false;
  }
 );
}

control("left","left");
control("right","right");
control("gas","gas");
control("brake","brake");

/* رانندگی */

let speed=0;

function drive(dt){

 if(c.gas)
  speed+=26*dt;

 if(c.brake)
  speed-=45*dt;

 if(!c.gas&&!c.brake)
  speed-=5*dt;

 speed=
 THREE.MathUtils.clamp(
  speed,0,55
 );

 let steer=0;

 if(c.left) steer=1;
 if(c.right) steer=-1;

 if(speed>1){

  car.rotation.y+=
   steer*.75*dt*(speed/55);
 }

 car.translateZ(
  -speed*dt
 );

 car.position.x=
 THREE.MathUtils.clamp(
  car.position.x,-7,7
 );

 document.getElementById(
  "speed"
 ).textContent=
 "سرعت: "+
 Math.round(speed*2)+
 " km/h";
}

/* دوربین */

function follow(){

 const target=new THREE.Vector3(
  car.position.x,
  5.5,
  car.position.z+10
 );

 camera.position.lerp(
  target,.08
 );

 camera.lookAt(
  car.position.x,
  1,
  car.position.z-7
 );
}

/* گاراژ */

const garage=
document.getElementById("garage");

document.getElementById(
 "garageBtn"
).onclick=()=>{

 garage.style.display=
 garage.style.display==="block"
 ?"none":"block";
};

document.getElementById(
 "color"
).onchange=e=>{

 bodyMat.color.set(
  e.target.value
 );
};

/* اجرا */

let last=performance.now();

function loop(now){

 requestAnimationFrame(loop);

 const dt=Math.min(
  (now-last)/1000,.05
 );

 last=now;

 drive(dt);
 follow();

 renderer.render(
  scene,
  camera
 );
}

loop(last);

/* اندازه */

addEventListener(
 "resize",
 ()=>{
  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );
 }
);

</script>
</body>
</html>
