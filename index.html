<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Roham Car Game 3D V2</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#87ceeb;
  touch-action:none;
  font-family:Arial,sans-serif;
}
#game{
  position:fixed;
  inset:0;
}
#hud{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  z-index:10;
  pointer-events:none;
}
.panel{
  background:rgba(10,15,20,.78);
  color:white;
  padding:10px 13px;
  border-radius:12px;
  font-size:14px;
}
#controls{
  position:fixed;
  left:0;
  right:0;
  bottom:20px;
  display:flex;
  justify-content:space-between;
  padding:0 20px;
  z-index:20;
  pointer-events:none;
}
.group{
  display:flex;
  gap:10px;
  pointer-events:auto;
}
.btn{
  width:72px;
  height:72px;
  border:0;
  border-radius:50%;
  background:rgba(15,20,25,.82);
  color:white;
  font-size:25px;
  font-weight:bold;
  border:2px solid rgba(255,255,255,.25);
  touch-action:none;
}
.btn.big{
  width:82px;
  border-radius:20px;
  font-size:15px;
}
.btn:active{
  transform:scale(.93);
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
  <div class="panel">
    <b>Roham Car Game 3D</b><br>
    <span id="speed">سرعت: 0 km/h</span>
  </div>

  <div class="panel">
    V2 — سه‌بعدی
  </div>
</div>

<div id="controls">

  <div class="group">
    <button class="btn" id="left">◀</button>
    <button class="btn" id="right">▶</button>
  </div>

  <div class="group">
    <button class="btn big" id="brake">ترمز</button>
    <button class="btn big" id="gas">گاز</button>
  </div>

</div>

<script type="module">

import * as THREE from
"https://unpkg.com/three@0.160.0/build/three.module.js";

const game = document.getElementById("game");
const speedText = document.getElementById("speed");

/* -------------------------
   Scene
------------------------- */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(
  0x87ceeb,
  60,
  450
);

/* -------------------------
   Camera
------------------------- */

const camera = new THREE.PerspectiveCamera(
  65,
  innerWidth / innerHeight,
  0.1,
  1000
);

camera.position.set(
  0,
  6,
  11
);

/* -------------------------
   Renderer
------------------------- */

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.5)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled = false;

game.appendChild(renderer.domElement);

/* -------------------------
   Light
------------------------- */

const ambient = new THREE.HemisphereLight(
  0xffffff,
  0x555555,
  1.5
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
  0xffffff,
  1.2
);

sun.position.set(
  50,
  100,
  50
);

scene.add(sun);

/* -------------------------
   Ground
------------------------- */

const groundMat =
  new THREE.MeshLambertMaterial({
    color:0x39733f
  });

const ground =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      1000,
      1000
    ),
    groundMat
  );

ground.rotation.x =
  -Math.PI / 2;

ground.position.y = -0.05;

scene.add(ground);

/* -------------------------
   Road
------------------------- */

const roadMat =
  new THREE.MeshLambertMaterial({
    color:0x33373b
  });

const road =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      18,
      1000
    ),
    roadMat
  );

road.rotation.x =
  -Math.PI / 2;

scene.add(road);

/* -------------------------
   Road lines
------------------------- */

const lineMat =
  new THREE.MeshBasicMaterial({
    color:0xffffff
  });

for(let z=-480; z<500; z+=20){

  const line =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        0.35,
        0.03,
        9
      ),
      lineMat
    );

  line.position.set(
    0,
    0.03,
    z
  );

  scene.add(line);
}

/* -------------------------
   Sidewalks
------------------------- */

const sidewalkMat =
  new THREE.MeshLambertMaterial({
    color:0x777777
  });

for(const x of [-10,10]){

  const sidewalk =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        3,
        0.25,
        1000
      ),
      sidewalkMat
    );

  sidewalk.position.set(
    x,
    0.12,
    0
  );

  scene.add(sidewalk);
}

/* -------------------------
   Buildings
------------------------- */

function createBuilding(
  x,
  z,
  w,
  h,
  d
){

  const mat =
    new THREE.MeshLambertMaterial({
      color:
        new THREE.Color(
          0.25 +
          Math.random()*0.35,
          0.25 +
          Math.random()*0.35,
          0.25 +
          Math.random()*0.35
        )
    });

  const building =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,
        h,
        d
      ),
      mat
    );

  building.position.set(
    x,
    h/2,
    z
  );

  scene.add(building);

  /* windows */

  for(
    let yy=2;
    yy<h-1;
    yy+=3
  ){

    for(
      let zz=z-d/2+1;
      zz<z+d/2;
      zz+=3
    ){

      const windowMat =
        new THREE.MeshBasicMaterial({
          color:0xffe69a
        });

      const win =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            0.08,
            1,
            1.2
          ),
          windowMat
        );

      const side =
        x < 0
        ? -1
        : 1;

      win.position.set(
        x + side*w/2,
        yy,
        zz
      );

      scene.add(win);
    }
  }
}

/* شهر دو طرف خیابان */

for(let z=-450;z<450;z+=35){

  createBuilding(
    -16-Math.random()*8,
    z,
    8,
    8+Math.random()*15,
    20
  );

  createBuilding(
    16+Math.random()*8,
    z+15,
    8,
    7+Math.random()*18,
    18
  );
}

/* -------------------------
   Car
------------------------- */

const car =
  new THREE.Group();

scene.add(car);

car.position.set(
  0,
  0,
  10
);

/* body */

const bodyMat =
  new THREE.MeshLambertMaterial({
    color:0x1597e5
  });

const body =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      2.2,
      0.65,
      4
    ),
    bodyMat
  );

body.position.y =
  0.65;

car.add(body);

/* roof */

const roofMat =
  new THREE.MeshLambertMaterial({
    color:0x0d5d91
  });

const roof =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      1.65,
      0.6,
      2
    ),
    roofMat
  );

roof.position.set(
  0,
  1.15,
  0
);

car.add(roof);

/* windows */

const glassMat =
  new THREE.MeshBasicMaterial({
    color:0x172a3a
  });

const frontWindow =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      1.5,
      0.45,
      0.05
    ),
    glassMat
  );

frontWindow.position.set(
  0,
  1.17,
  -1.02
);

car.add(frontWindow);

const backWindow =
  frontWindow.clone();

backWindow.position.z = 1.02;

car.add(backWindow);

/* wheels */

const wheelMat =
  new THREE.MeshLambertMaterial({
    color:0x111111
  });

function makeWheel(x,z){

  const wheel =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.43,
        0.43,
        0.28,
        16
      ),
      wheelMat
    );

  wheel.rotation.z =
    Math.PI/2;

  wheel.position.set(
    x,
    0.45,
    z
  );

  car.add(wheel);
}

makeWheel(-1.15,-1.35);
makeWheel(1.15,-1.35);
makeWheel(-1.15,1.35);
makeWheel(1.15,1.35);

/* headlights */

const lightMat =
  new THREE.MeshBasicMaterial({
    color:0xffffcc
  });

for(const x of [-0.65,0.65]){

  const light =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        0.35,
        0.18,
        0.08
      ),
      lightMat
    );

  light.position.set(
    x,
    0.78,
    -2.02
  );

  car.add(light);
}

/* -------------------------
   Controls
------------------------- */

const controls = {
  left:false,
  right:false,
  gas:false,
  brake:false
};

function setupButton(
  id,
  key
){

  const b =
    document.getElementById(id);

  b.addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      controls[key]=true;
    }
  );

  b.addEventListener(
    "pointerup",
    e=>{
      e.preventDefault();
      controls[key]=false;
    }
  );

  b.addEventListener(
    "pointercancel",
    ()=>{
      controls[key]=false;
    }
  );

  b.addEventListener(
    "pointerleave",
    ()=>{
      controls[key]=false;
    }
  );
}

setupButton("left","left");
setupButton("right","right");
setupButton("gas","gas");
setupButton("brake","brake");

/* -------------------------
   Driving
------------------------- */

let speed = 0;
let steering = 0;

const maxSpeed = 55;
const acceleration = 28;
const brakePower = 50;
const friction = 8;

function updateCar(dt){

  /* gas */

  if(controls.gas){

    speed +=
      acceleration * dt;
  }

  /* brake */

  if(controls.brake){

    speed -=
      brakePower * dt;
  }

  /* friction */

  if(
    !controls.gas &&
    !controls.brake
  ){

    if(speed>0)
      speed -= friction*dt;

    if(speed<0)
      speed += friction*dt;
  }

  speed =
    THREE.MathUtils.clamp(
      speed,
      0,
      maxSpeed
    );

  /* steering */

  let targetSteering = 0;

  if(controls.left)
    targetSteering = 1;

  if(controls.right)
    targetSteering = -1;

  steering =
    THREE.MathUtils.lerp(
      steering,
      targetSteering,
      0.12
    );

  if(speed>1){

    car.rotation.y +=
      steering *
      0.8 *
      dt *
      (speed/maxSpeed);
  }

  /* movement */

  car.translateZ(
    -speed*dt
  );

  /* keep car on road */

  car.position.x =
    THREE.MathUtils.clamp(
      car.position.x,
      -7,
      7
    );

  /* speed display */

  speedText.textContent =
    "سرعت: "+
    Math.round(speed*2)+
    " km/h";
}

/* -------------------------
   Camera
------------------------- */

function updateCamera(){

  const target =
    new THREE.Vector3();

  target.set(
    car.position.x,
    car.position.y+5.2,
    car.position.z+10
  );

  camera.position.lerp(
    target,
    0.08
  );

  const look =
    new THREE.Vector3(
      car.position.x,
      0.8,
      car.position.z-8
    );

  camera.lookAt(look);
}

/* -------------------------
   Loop
------------------------- */

let last =
  performance.now();

function animate(now){

  requestAnimationFrame(
    animate
  );

  const dt =
    Math.min(
      (now-last)/1000,
      0.05
    );

  last = now;

  updateCar(dt);
  updateCamera();

  renderer.render(
    scene,
    camera
  );
}

animate(last);

/* -------------------------
   Resize
------------------------- */

addEventListener(
  "resize",
  ()=>{
    camera.aspect =
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

</script>

</body>
</html>
